# voxctrl-server with Docker Compose. Full guide: docs/server.md
#
# This file is all you need: it runs the image published with each VoxCtrl
# release, so nothing is compiled on your machine.
#
#   docker compose up -d
#   docker compose logs -f      # wait for "voxctrl-server ... is ready"
#
# Every setting has a default. To change one, put it in a file named `.env`
# beside this one (voxctrl-server.env from the same release lists them all).
#
# Upgrade:  docker compose pull && docker compose up -d
#
# To build the image from source instead, see docker-compose.build.yml.

services:
  voxctrl-server:
    # `latest` is the newest release. Set VOXCTRL_SERVER_VERSION to stay on
    # one version (0.9.22), or to `edge` for the build of the next release.
    image: ghcr.io/jrufer/voxctrl-server:${VOXCTRL_SERVER_VERSION:-latest}
    container_name: voxctrl-server
    restart: unless-stopped
    ports:
      # host:container. Change the left side to listen on another host port.
      - "${VOXCTRL_SERVER_PORT:-8787}:8787"
    environment:
      VOXCTRL_SERVER_BACKEND: ${VOXCTRL_SERVER_BACKEND:-parakeet}
      VOXCTRL_SERVER_MODEL: ${VOXCTRL_SERVER_MODEL:-tdt-0.6b-v3}
      VOXCTRL_SERVER_LANGUAGE: ${VOXCTRL_SERVER_LANGUAGE:-}
      VOXCTRL_SERVER_DEVICE: ${VOXCTRL_SERVER_DEVICE:-}
      # true = also clean up dictation for clients that ask (S1-mini, ~470 MB).
      VOXCTRL_SERVER_CLEANUP: ${VOXCTRL_SERVER_CLEANUP:-}
      VOXCTRL_SERVER_CLEANUP_GPU: ${VOXCTRL_SERVER_CLEANUP_GPU:-}
      # true = also speak for clients whose TTS engine is "VoxCtrl server".
      VOXCTRL_SERVER_TTS: ${VOXCTRL_SERVER_TTS:-}
      VOXCTRL_SERVER_TTS_ENGINES: ${VOXCTRL_SERVER_TTS_ENGINES:-}
      VOXCTRL_SERVER_TTS_ENGINE: ${VOXCTRL_SERVER_TTS_ENGINE:-}
      VOXCTRL_SERVER_TTS_VOICE: ${VOXCTRL_SERVER_TTS_VOICE:-}
      VOXCTRL_SERVER_AUDIOCPP_SERVER: ${VOXCTRL_SERVER_AUDIOCPP_SERVER:-}
      # true = pass clients' AI-processing requests on to the language model
      # service below. See "AI processing through the server" in docs/server.md.
      VOXCTRL_SERVER_LLM: ${VOXCTRL_SERVER_LLM:-}
      VOXCTRL_SERVER_LLM_ENDPOINT: ${VOXCTRL_SERVER_LLM_ENDPOINT:-}
      VOXCTRL_SERVER_LLM_MODEL: ${VOXCTRL_SERVER_LLM_MODEL:-}
      VOXCTRL_SERVER_LLM_API_KEY: ${VOXCTRL_SERVER_LLM_API_KEY:-}
      # true = encrypt connections (HTTPS only); clients pair with the code
      # from `docker exec voxctrl-server voxctrl-server --pairing-code`.
      VOXCTRL_SERVER_TLS: ${VOXCTRL_SERVER_TLS:-}
      # The address clients reach this machine by, for the pairing code.
      VOXCTRL_SERVER_PUBLIC_HOST: ${VOXCTRL_SERVER_PUBLIC_HOST:-}
      # Left blank, the server generates a key on first start, saves it in the
      # volume, and prints it once in the log.
      VOXCTRL_SERVER_API_KEY: ${VOXCTRL_SERVER_API_KEY:-}
    # Lets the server reach a service on this machine (such as Ollama) as
    # http://host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Downloaded models and server.toml (with the generated API key).
      - voxctrl-data:/var/lib/voxctrl

volumes:
  voxctrl-data:
