name: AUR packages

# Checks the PKGBUILDs in packaging/aur on Arch itself, before anything reaches
# the AUR. Publishing is a separate workflow (aur-publish.yml), and the check of
# each new release's own .deb runs in release.yml (job aur-smoke).
#
#   - On a PR touching packaging/aur or this file: build and install
#     voxctrl-bin from the latest published release's .deb and check it
#     (packaging/aur/smoke-test.sh).
#   - On a PR, weekly and on demand: build voxctrl-server from this checkout,
#     install it and check it. It has no prebuilt binary to repackage, so the
#     build is the only test there is; it is a fraction of the app's.
#   - Weekly, and on demand: build the source package from master in a clean
#     Arch container, to catch toolchain drift (a new Rust, CMake or shaderc)
#     before a user's `paru -S voxctrl` does. Too slow (30+ min) for every PR.
on:
  pull_request:
    paths:
      - "packaging/aur/**"
      - ".github/workflows/aur.yml"
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      source_build:
        description: "Also build the source package (slow)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bin-smoke:
    name: voxctrl-bin from the latest release
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools the checkout and download need
        run: pacman -Syu --noconfirm --needed git jq curl

      - uses: actions/checkout@v4

      # Drafts have no public download, so this is the newest *published*
      # release — what an AUR user would get today.
      - name: Download the latest release's WebGPU .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/${{ github.repository }}
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          id=$(curl -fsSL "${auth[@]}" "$api/releases/latest" \
            | jq -r '.assets[] | select(.name == "VoxCtrl-linux-x86_64-vulkan-webgpu.deb") | .id')
          [ -n "$id" ] || { echo "::error::The latest release has no VoxCtrl-linux-x86_64-vulkan-webgpu.deb"; exit 1; }
          curl -fsSL "${auth[@]}" -H "Accept: application/octet-stream" -o voxctrl.deb "$api/releases/assets/$id"
          ls -l voxctrl.deb

      - name: Smoke test
        run: packaging/aur/smoke-test.sh voxctrl.deb

  server-build:
    name: voxctrl-server from this checkout
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git namcap

      - uses: actions/checkout@v4

      # The PKGBUILD downloads the tag's tarball; stand this checkout in for it,
      # under the name and top-level directory GitHub's archive would have.
      - name: Build the package from this checkout
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          useradd -m builder
          work=$(mktemp -d)
          cp packaging/aur/voxctrl-server/PKGBUILD packaging/aur/voxctrl-server/*.install "$work/"
          pkgver=$(sed -n 's/^pkgver=//p' "$work/PKGBUILD")
          git archive --format=tar.gz --prefix="VoxCtrl-$pkgver/" -o "$work/voxctrl-$pkgver.tar.gz" HEAD
          chown -R builder: "$work"
          namcap "$work/PKGBUILD"
          # -s installs makedepends; builder needs pacman for that.
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          su builder -c "cd '$work' && makepkg -s --noconfirm --skipchecksums -f"
          cp "$work"/voxctrl-server-*.pkg.tar.zst /tmp/voxctrl-server.pkg.tar.zst

      - name: Install and check
        run: |
          set -euo pipefail
          pkg=/tmp/voxctrl-server.pkg.tar.zst
          namcap "$pkg" | tee /tmp/namcap.txt
          if grep -E ' E: ' /tmp/namcap.txt; then
            echo "::error::namcap reported errors"; exit 1
          fi
          # pacman -U resolves every `depends` entry for real.
          pacman -U --noconfirm "$pkg"

          echo "── files"
          pacman -Qlq voxctrl-server | grep -v '/$' | sort | tee /tmp/files.txt
          for path in /usr/bin/voxctrl-server \
                      /usr/lib/voxctrl-server/voxctrl-server \
                      /usr/lib/voxctrl-server/voxctrl-llm-sidecar \
                      /usr/lib/systemd/system/voxctrl-server.service \
                      /usr/lib/sysusers.d/voxctrl-server.conf \
                      /usr/lib/tmpfiles.d/voxctrl-server.conf \
                      /usr/share/licenses/voxctrl-server/LICENSE; do
            grep -qx "$path" /tmp/files.txt || { echo "::error::$path is not in the package"; exit 1; }
          done
          # Nothing the app packages own, so both can be installed together.
          if grep -qx '/usr/bin/voxctrl-llm-sidecar' /tmp/files.txt; then
            echo "::error::/usr/bin/voxctrl-llm-sidecar belongs to the voxctrl packages"; exit 1
          fi

          echo "── libraries"
          for bin in /usr/lib/voxctrl-server/voxctrl-server /usr/lib/voxctrl-server/voxctrl-llm-sidecar; do
            ldd "$bin" | (! grep 'not found')
          done

          echo "── it runs"
          voxctrl-server --version
          voxctrl-server --version | grep -q "voxctrl-server $(sed -n 's/^pkgver=//p' packaging/aur/voxctrl-server/PKGBUILD)"
          voxctrl-server --print-config --config /tmp/none.toml >/dev/null

          echo "── service account and unit"
          # pacman's hooks run systemd-sysusers and systemd-tmpfiles in a real
          # install; a container has no systemd running, so apply them here.
          systemd-sysusers /usr/lib/sysusers.d/voxctrl-server.conf
          systemd-tmpfiles --create /usr/lib/tmpfiles.d/voxctrl-server.conf
          id voxctrl
          [ "$(getent passwd voxctrl | cut -d: -f6)" = /var/lib/voxctrl ]
          [ "$(stat -c '%U:%G %a' /var/lib/voxctrl)" = "voxctrl:voxctrl 750" ]
          grep -qx 'ExecStart=/usr/bin/voxctrl-server' /usr/lib/systemd/system/voxctrl-server.service
          systemd-analyze verify /usr/lib/systemd/system/voxctrl-server.service

          echo "── as the service account: first-start files land in its home"
          # The same thing the unit does, as far as a container allows: the
          # service's user and HOME. --pairing-code needs a key, which only a
          # first start makes, so it must say so rather than invent one.
          out=$(su -s /bin/sh voxctrl -c 'HOME=/var/lib/voxctrl voxctrl-server --pairing-code' 2>&1 || true)
          echo "$out"
          grep -q 'no API key yet' <<< "$out"

  source-build:
    name: voxctrl (source) from master
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.source_build)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 120
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git namcap

      - uses: actions/checkout@v4

      # The PKGBUILD downloads the tag's tarball; stand this checkout in for it,
      # under the name and top-level directory GitHub's archive would have.
      - name: Build the package from this checkout
        run: |
          set -euo pipefail
          useradd -m builder
          work=$(mktemp -d)
          cp packaging/aur/voxctrl/PKGBUILD "$work/"
          pkgver=$(sed -n 's/^pkgver=//p' "$work/PKGBUILD")
          git archive --format=tar.gz --prefix="VoxCtrl-$pkgver/" -o "$work/voxctrl-$pkgver.tar.gz" HEAD
          chown -R builder: "$work"
          namcap "$work/PKGBUILD"
          # -s installs makedepends; builder needs pacman for that.
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          su builder -c "cd '$work' && makepkg -s --noconfirm --skipchecksums -f"
          pacman -U --noconfirm "$work"/voxctrl-*.pkg.tar.zst
          namcap "$work"/voxctrl-*.pkg.tar.zst
          ldd /usr/bin/voxctrl | (! grep 'not found')
          voxctrl --version
