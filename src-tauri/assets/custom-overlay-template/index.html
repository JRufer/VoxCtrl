<!--
  VoxCtrl custom overlay template — "Custom"

  This is a working copy of the built-in Voice Card style. The only
  intentional visual difference from Voice Card is the brand line below,
  which reads "CUSTOM OVERLAY" instead of "VOXCTRL" — everything else (the
  gold chip, the VU-meter LED matrix, the status stamp, the target field)
  behaves the same, so you can see precisely what changed and use this
  file as a starting point for your own design.

  HOW THIS GETS LOADED
  ─────────────────────
  VoxCtrl scans the custom-overlays folder shown at the bottom of
  Settings → Visual & Feedback for subfolders containing an index.html +
  style.css pair. Each subfolder becomes a selectable "Overlay style" in
  that tab, named after the folder (this one is named "Custom"). Edit a
  file, then switch the Overlay style dropdown away and back — that's
  enough to see the change; VoxCtrl re-reads every custom overlay's files
  from disk each time the style changes, so no restart is needed.

  This particular folder is also special in one more way: on startup,
  VoxCtrl refreshes Custom/index.html and Custom/style.css (and the
  overlays folder's own README.md) to whatever the installed build
  ships — but only while they still match what it last wrote. The moment
  you edit either file, VoxCtrl notices on the next launch and leaves
  Custom/ alone from then on, so in-progress edits are never silently
  lost. If you'd rather not think about any of this, duplicate this
  folder under a new name instead — a differently-named folder is never
  touched, edited or not.

  TEMPLATE PLACEHOLDERS
  ──────────────────────
  One placeholder is substituted into this HTML before it's shown:
    {{target}}   the active routing target's label (e.g. "Focused Window"),
                 substituted once, at the moment this HTML is rendered.
  ({{trigger}} is also available and carries the same value, kept for
  symmetry with the placeholder VoxCtrl substitutes elsewhere.)

  WHY THIS TEMPLATE HAS NO <script> TAG
  ───────────────────────────────────────
  VoxCtrl's window content-security-policy is `script-src 'self'` — no
  `unsafe-inline` — the same restriction that stops a compromised or
  malicious page from running arbitrary injected script anywhere else in
  the app. That blocks inline <script> tags everywhere, including ones
  written into a custom overlay's index.html, whether they're present in
  the file or inserted at runtime: the browser silently refuses to run
  them, with no visible error in this window (there's no on-screen
  console). If your overlay depends on a <script> block to reveal itself,
  it will render completely invisible with no other symptom — this is
  almost certainly why, if you're debugging one.

  Everything below reacts to live state a different way instead: VoxCtrl
  continuously writes the app's status onto CSS custom properties on the
  page's root element:

    --voxctrl-recording       0 or 1
    --voxctrl-processing      0 or 1 — Whisper is transcribing
    --voxctrl-speaking        0 or 1 — TTS is talking back
    --voxctrl-mcp-recording   0 or 1 — an MCP client triggered recording
    --voxctrl-audio-ready     0 or 1 — 0 while the mic is still connecting
    --voxctrl-audio-level     0..1, the smoothed microphone level

  ordinary CSS — var(), calc(), clamp(), transition — reads these
  directly with no script needed at all, and works under the CSP as
  shipped. See style.css for how this template uses them: the card's
  on/off flip, the status-stamp text swap, and the audio-reactive LED
  matrix are all driven this way.
-->

    <div class="vc-custom-chip">

      <span class="vc-custom-chip-line h2"></span>
      <span class="vc-custom-chip-line v"></span>
    </div>

    <!-- The one deliberate difference from the built-in Voice Card style. -->
    <span class="vc-custom-brand">CUSTOM OVERLAY</span>

    <!-- Three pre-rendered labels stacked on top of each other; style.css
         shows/hides each with the state formulas defined on .vc-custom-card,
         since CSS can't swap text content based on a variable's value. -->
    <span class="vc-custom-stamp">
      <span class="vc-custom-stamp-dot"></span>
      <span class="vc-custom-stamp-text s-rec">REC</span>
      <span class="vc-custom-stamp-text s-init">INIT</span>
      <span class="vc-custom-stamp-text s-proc">PROC</span>
    </span>
