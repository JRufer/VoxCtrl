[package]
name = "voxctrl-clipboard"
version.workspace = true
edition.workspace = true

# Full-fidelity clipboard backup and restore, plus placing transient text on
# the clipboard. Every format the clipboard offers is saved — not just text —
# so borrowing it to paste a dictation loses nothing the user had copied.
#
# Its own crate (not part of `voxctrl-inject`) so the platform code sits apart
# from the keystroke logic and can be tested on its own.
[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
wl-clipboard-rs = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }
