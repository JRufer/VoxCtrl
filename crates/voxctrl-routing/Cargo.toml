[package]
name = "voxctrl-routing"
version.workspace = true
edition.workspace = true

[dependencies]
# `find_in_path`: one implementation of "can this be spawned?", shared with the
# rest of the app rather than a second, subtly different copy here.
voxctrl-text = { workspace = true }
voxctrl-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
arboard = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"

# Text delivery for the `inject` target: paste-or-type, shared with the app.
voxctrl-inject = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
