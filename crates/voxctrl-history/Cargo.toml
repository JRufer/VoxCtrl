[package]
name = "voxctrl-history"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# XChaCha20-Poly1305 for the opt-in on-disk history; its key never sits next to
# the file (see keys.rs).
chacha20poly1305 = { version = "0.10.1", features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop keyring (Secret Service: KWallet, GNOME Keyring) over the same
# D-Bus library the rest of VoxCtrl uses.
zbus = { workspace = true }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
