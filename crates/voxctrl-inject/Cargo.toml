[package]
name = "voxctrl-inject"
version.workspace = true
edition.workspace = true

[dependencies]
voxctrl-config = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
notify-rust = { workspace = true }
voxctrl-winput = { workspace = true }
voxctrl-clipboard = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
# Key injection on Wayland through the RemoteDesktop portal. Same build of
# ashpd as voxctrl-hotkeys (async-io reactor; see the workspace manifest).
ashpd = { workspace = true }
enumflags2 = "0.7"
dirs = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A stand-in portal for the RemoteDesktop test. The same zbus ashpd uses.
zbus5 = { package = "zbus", version = "5" }
